services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: letters-api
    ports:
      - "${PORT:-30080}:30080"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=30080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:30080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

networks:
  default:
    name: letters-network
